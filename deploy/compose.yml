services:
  api:
    build: ../Api
    ports:
      - "5000:8080"
    env_file:
      - ../.env
    environment:
      ASPNETCORE_URLS: http://+:8080

  # Optional local Postgres for no-network dev: docker compose --profile offline up
  db:
    image: postgres:16
    profiles:
      - offline
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gigood_dev
    ports:
      - "5432:5432"
    volumes:
      - gigood_pgdata:/var/lib/postgresql/data

volumes:
  gigood_pgdata:
