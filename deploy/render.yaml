services:
  - type: web
    name: gigood-api
    env: docker
    dockerfilePath: Api/Dockerfile
    # The Dockerfile COPYs Api.csproj from the context root, so the context must
    # be Api/ (same as deploy/compose.yml `build: ../Api`), not the repo root.
    dockerContext: Api
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: GiGood
      - key: Jwt__Audience
        value: GiGoodMobile
      # Set to the static site origin (e.g. https://gigood-web.onrender.com) or
      # the browser blocks the admin app's calls (Program.cs CORS policy).
      - key: Cors__WebOrigin
        sync: false

  - type: web
    name: gigood-web
    env: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
